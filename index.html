<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Business Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="center">
    <section class="card" aria-label="Business card for Akshay Srivastava">
      <div class="card-inner">
        <div class="brand">
          <img class="avatar" src="https://avatars.githubusercontent.com/u/198231150?v=4" alt="Akshay Srivastava">
          <div>
            <h2 class="company">Kuken Industries</h2>
            <div class="slogan">Fukuoka, Japan</div>
          </div>
        </div>

        <div class="card-body">
          <div class="left">
            <div class="person-name">Akshay Srivastava</div>
            <div class="person-title">International Sales Engineer</div>

            <div class="contact-list">
              <a class="contact-link" href="tel:090-1365-6148">090-1365-6148</a>
              <a class="contact-link" href="mailto:akshay.srivastava543@gmail.com">akshay.srivastava543@gmail.com</a>
              <a class="contact-link" href="https://portfolio-akshay01123.github.io" target="_blank" rel="noopener noreferrer">portfolio-akshay01123.github.io</a>
            </div>

            <div class="socials" aria-label="Social links">
              <a class="social" href="https://www.linkedin.com/in/akshay543/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
              <a class="social" href="https://github.com/akshay01123" target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
          </div>

          <div class="right">
            <div class="qr" aria-hidden="false">
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://portfolio-akshay01123.github.io" alt="QR code to portfolio">
            </div>
          </div>
        </div>

        <div class="contact-row" aria-hidden="true">
          <button id="shareBtn" class="action-btn">Share</button>
          <button id="downloadBtn" class="action-btn">Download</button>
        </div>
      </div>

      <div class="brand-mark" aria-hidden="true">
        <span class="brand-mark-letter">K</span>
        <span class="brand-mark-name">Kuken<br>Industries</span>
      </div>
    </section>
  </main>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
