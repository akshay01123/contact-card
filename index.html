<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Business Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="center">
    <aside class="editor" aria-label="Card editor">
      <h3>Build your card</h3>
      <form id="cardForm">
        <label>
          Name
          <input id="nameInput" type="text" placeholder="Your name">
        </label>

        <label>
          Company
          <input id="companyInput" type="text" placeholder="Company name">
        </label>

        <label>
          Phone
          <input id="phoneInput" type="tel" placeholder="090-1234-5678">
        </label>

        <label>
          Email
          <input id="emailInput" type="email" placeholder="you@example.com">
        </label>

        <fieldset>
          <legend>Design</legend>
          <label><input name="theme" type="radio" value="default" checked> Classic</label>
          <label><input name="theme" type="radio" value="dark"> Dark</label>
          <label><input name="theme" type="radio" value="modern"> Modern</label>
          <label><input name="theme" type="radio" value="minimal"> Minimal</label>
        </fieldset>

        <div class="editor-actions">
          <button type="button" id="runBtn">Run</button>
          <button type="button" id="resetBtn">Reset</button>
        </div>
        <div class="export-options">
          <label>
            Export DPI
            <select id="exportDpi">
              <option value="300" selected>Print - 300 DPI (meishi)</option>
              <option value="200">200 DPI</option>
              <option value="72">Web - 72 DPI</option>
            </select>
          </label>
        </div>
      </form>
    </aside>
    <section class="card" aria-label="Business card for Akshay Srivastava">
      <div class="card-inner">
        <!-- simple illustration used by the Minimal design -->
        <div class="minimal-illustration" aria-hidden="true">
          <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
            <rect width="160" height="160" rx="10" fill="#fff" />
            <g stroke="#0b1f33" stroke-width="2" fill="none" transform="translate(22,18)">
              <circle cx="38" cy="28" r="20" />
              <path d="M6 96c8-18 28-28 52-28s44 10 52 28" stroke-linecap="round" />
              <rect x="18" y="56" width="40" height="28" rx="4" />
              <circle cx="36" cy="70" r="6" fill="#0b1f33" />
            </g>
          </svg>
        </div>
        <div class="brand">
          <img class="avatar" src="https://avatars.githubusercontent.com/u/198231150?v=4" alt="Akshay Srivastava">
          <h2 class="company">Kuken Industries</h2>
          <div class="slogan">Fukuoka, Japan</div>
        </div>

        <div class="card-body">
          <div class="left">
            <div class="person-name">Akshay Srivastava</div>
            <div class="person-title">International Sales Engineer</div>

            <div class="contact-list">
              <a id="phoneLink" class="contact-link" href="tel:090-1365-6148">090-1365-6148</a>
              <a id="emailLink" class="contact-link" href="mailto:akshay.srivastava543@gmail.com">akshay.srivastava543@gmail.com</a>
              <a id="portfolioLink" class="contact-link" href="https://portfolio-akshay01123.github.io" target="_blank" rel="noopener noreferrer">portfolio-akshay01123.github.io</a>
            </div>

            <div class="socials" aria-label="Social links">
              <a class="social" href="https://www.linkedin.com/in/akshay543/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
              <a class="social" href="https://github.com/akshay01123" target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
          </div>

          <div class="right">
            <!-- QR removed per user request; add separately when needed -->
          </div>
        </div>

        <div class="contact-row" aria-hidden="true">
          <button id="shareBtn" class="action-btn">Share</button>
          <button id="downloadBtn" class="action-btn">Download</button>
        </div>
      </div>

      <div class="brand-mark" aria-hidden="true">
        <span class="brand-mark-letter">K</span>
        <span class="brand-mark-name">Kuken<br>Industries</span>
      </div>
    </section>
  </main>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
